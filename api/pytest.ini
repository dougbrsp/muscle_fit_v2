[pytest]
# Rodar SEMPRE a partir de api/ (ex.: `cd api && python -m pytest tests/unit`).
# pythonpath = . deixa `import app...` funcionando sem instalar o pacote.
pythonpath = .
# privado/tests: testes do submodulo privado api/privado (M103 P1; asserts com
# frases dos prompts). Sem o submodulo o glob nao acha nada e so `tests` roda.
testpaths = tests privado/tests
# --import-mode=importlib: permite arquivos de teste com o mesmo nome em
# tests/unit e tests/integration SEM exigir __init__.py nos diretorios de
# teste (qualquer PR pode criar tests/unit/test_x.py isolado e rodar
# `python -m pytest tests/unit/test_x.py`).
# -m "not slow": os testes de MEDICAO de desempenho (dataset de 16 mil series,
# dezenas de segundos de carga) ficam FORA de qualquer execucao normal,
# inclusive da suite de integracao. Rode-os sob demanda com `-m slow`.
#
# ATENCAO - pegadinha do pytest: um `-m` na linha de comando SUBSTITUI este,
# nao se soma a ele. `pytest -m dataapi` seleciona os slow tambem, e foi assim
# que as medicoes voltaram ao caminho critico do CI e reprovaram PRs sem
# relacao com elas (o #213, exclusivamente frontend). Quem precisa filtrar por
# outro marcador escreve o `and not slow` a mao:
#     python -m pytest tests/integration -m "dataapi and not slow"
# -m "not slow and not llm_eval": alem das medicoes, ficam FORA de qualquer
# execucao normal os testes de avaliacao de resposta COM LLM (F3.2,
# tests/eval/). Eles chamam a OpenAI de verdade - custam dinheiro a cada
# execucao e nao sao deterministicos (a mesma pergunta pode reprovar hoje e
# passar amanha sem mudanca de codigo). Rode-os sob demanda:
#     cd api && OPENAI_API_KEY=... python -m pytest -s -m llm_eval tests/eval
# Ver tests/eval/README.md. A METADE deterministica da avaliacao
# (tests/eval/test_package_eval.py) NAO tem marcador e roda em todo PR.
addopts = -ra --strict-markers --import-mode=importlib -m "not slow and not llm_eval"
xfail_strict = true
markers =
    integration: exige MySQL real (schema de teste isolado criado por tests/integration/conftest.py)
    dataapi: caminho de producao do banco (shim app/db_dataapi.py) contra o dublê da RDS Data API (tests/support/fake_rds_data.py)
    slow: medicao de desempenho com dataset grande (ver tests/integration/dataapi/test_dashboard_drilldown_performance.py e tests/support/medicao.py)
    llm_eval: avaliacao de resposta COM chamada real a OpenAI (custa dinheiro, nao deterministica) - ver tests/eval/README.md
