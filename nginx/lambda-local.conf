# Endpoint LOCAL da API Lambda `Invoke` - SOMENTE Docker Compose de dev.
# Ver docs/local-dev.md ("Jobs assincronos") e
# dev/lambda-local/lambda_invoke_emulator.py.
#
# O boto3 do servico `api` usa AWS_ENDPOINT_URL_LAMBDA=http://nginx:9001, ou
# seja, UM unico endpoint para todas as funcoes. Aqui o path
# /2015-03-31/functions/<nome>/invocations e roteado para o container que
# roda a imagem de producao certa daquela funcao. Hoje todas as funcoes
# assincronas (plan-generator, cardio-agent, workout-ai) rodam na mesma imagem
# (api/Dockerfile.ai) -> lambda-ai, como em infra/lambda_ai_generators.tf e
# infra/lambda_workout_ai.tf. Funcao desconhecida (inclusive a antiga
# musclefit-reports, removida) cai em lambda-ai, que responde 404
# ResourceNotFoundException (igual AWS).
#
# Porta NAO publicada no host (so rede interna do compose).

server {
    listen 9001;

    # Mesma resolucao dinamica de nginx/local-dev.conf: sem ela, reiniciar
    # lambda-ai deixava o nginx com o IP antigo (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $lambda_ai lambda-ai;

    # Invoke sincrono (RequestResponse) aceita ate 6 MB de payload na AWS.
    client_max_body_size 6m;
    # Maior timeout de funcao assincrona em producao: 180s (plan-generator,
    # desde o card ilustrado de exercicio - ver infra/lambda_ai_generators.tf
    # e LAMBDA_LOCAL_FUNCTIONS no docker-compose.yml) + 10s de folga, mesma
    # margem de antes (120s -> 130s).
    proxy_read_timeout 190s;
    proxy_http_version 1.1;

    location = /health {
        return 200 '{"status":"ok"}';
    }

    location / {
        proxy_pass http://$lambda_ai:9001;
    }
}
