# Proxy reverso de DEV LOCAL que replica, na maquina do desenvolvedor, o
# roteamento por path que o API Gateway faz em producao entre as 2 Lambdas
# HTTP (musclefit-api-core e musclefit-engines) - ver infra/api_gateway.tf e
# docs/local-dev.md ("Arquitetura de 2 backends + proxy").
#
# Este container escuta na porta 8000 do host (a mesma porta que o servico
# `api` publicava sozinho antes desta mudanca) e decide, path a path, se a
# requisicao vai para `api` (musclefit-api-core, catch-all) ou para
# `api-engines` (musclefit-engines, paths especificos abaixo).
#
# ============================================================================
# ATENCAO - MANTER SINCRONIZADO MANUALMENTE COM O TERRAFORM
# ============================================================================
# A lista de paths abaixo foi transcrita a mao de
# `infra/api_gateway.tf`, locals `engines_analytics_path_parts` (sob
# /analytics/) e `engines_exercise_path_parts` (sob /exercises/). Isso NAO e
# gerado automaticamente. Sempre que esses locals mudarem no Terraform
# (adicionar/remover/renomear um path movido para musclefit-engines), este
# arquivo precisa ser atualizado manualmente na mesma PR - ver aviso tambem
# em docs/local-dev.md.
# ============================================================================

server {
    listen 8000;

    # Resolucao DINAMICA dos backends pelo DNS embutido do Docker (127.0.0.11):
    # com `proxy_pass http://api:8000` literal o nginx resolve o nome UMA vez,
    # no start, e depois de `docker compose restart api`/`up -d api` (container
    # novo pode voltar com outro IP) responde 502 ate o proprio nginx ser
    # reiniciado. Com o host numa variavel, o nome e resolvido por requisicao
    # (cache de 10s). O path repassado nao muda: proxy_pass sem URI envia a
    # URI original, como antes. So dev local - nada disso existe em producao
    # (la o roteamento e do API Gateway, ver infra/api_gateway.tf).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_core api;
    set $api_engines api-engines;

    # ---- /analytics/* -> musclefit-engines (app/analytics.py +
    # app/dashboard_modules.py + app/dashboard_intelligence.py) ----
    # Fonte: infra/api_gateway.tf, local.engines_analytics_path_parts
    location = /analytics/summary { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/training-trend { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/exercise-progress { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/rpe-distribution { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/cardio { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/muscle-groups-equivalent-sets-by-activity { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/muscle-activation-by-activity { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/muscle-groups-recent-exercise-volume { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/muscle-groups-slot-comparison { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/muscle-groups-daily-activation { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/muscle-activation-preview { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/muscle-activation-breakdown { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/dashboard-muscle-status { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/dashboard-muscle-drilldown { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/dashboard-progression { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/dashboard-progression-trend { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/dashboard-progression-suggestion { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/dashboard-progression-by-muscle-group { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/dashboard-workout-sessions { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/dashboard-recovery { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/dashboard-cycle { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/dashboard-stimulus-fatigue { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    # /analytics/health (analytics.py) - health check do PROPRIO router, NAO
    # o /health da Lambda/proxy.
    location = /analytics/health { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/body-composition-trend { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/training-volume { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/training-volume-by-split-day { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/muscle-recovery { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/muscle-recovery-consecutive-check { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/muscle-group-body-map { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/training-evolution { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/cardio-agent-context { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /analytics/methodology-realized { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    # Novo Dashboard (app/analytics_dashboard.py): unico bloco por PREFIXO,
    # porque a rota tem segmento dinamico no meio
    # (/analytics/dashboard/exercises/{exercise_id}/progress) e um
    # `location =` nunca casaria. Equivale ao "{proxy+}" sob o resource
    # "dashboard" em infra/api_gateway.tf. As rotas v2 sao
    # "/analytics/dashboard-*" (com HIFEN) e continuam nos `location =` acima.
    location /analytics/dashboard/ { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }

    # ---- /exercises/* -> musclefit-engines (app/engines_extra.py) ----
    # Fonte: infra/api_gateway.tf, local.engines_exercise_path_parts
    location = /exercises/suggested-progression { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }
    location = /exercises/suggested-set-count-for-substitution { proxy_pass http://$api_engines:8000; include /etc/nginx/proxy_params.conf; }

    # ---- catch-all -> musclefit-api-core (equivalente ao {proxy+} do API
    # Gateway - qualquer path que NAO tenha um `location =` explicito acima,
    # incluindo /health, /ready, /activities, /analytics/muscle-groups-mapped-table
    # e todo o resto). ----
    location / {
        proxy_pass http://$api_core:8000;
        include /etc/nginx/proxy_params.conf;
    }
}
